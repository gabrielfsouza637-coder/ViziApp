{% extends 'base.html' %}

{% block title %}Cadastro de Morador - ViziApp{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Cadastro de Morador</h1>

    <form method="POST">
        {% csrf_token %}
        <p>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </p>
        <p>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </p>
        <p>
            <label for="cidade">Cidade / Município:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Ex: Natal, Parnamirim..." required>
        </p>
        <p>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
        </p>

        <button type="submit" class="btn-submit">Criar Minha Conta</button>
    </form>

    <a href="{% url 'escolher_cadastro' %}" class="link-voltar">Voltar</a>
</div>
{% endblock %}
