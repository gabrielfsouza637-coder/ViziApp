{% extends 'base.html' %}
{% load static %}

{% block title %}Login - ViziApp{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <img src="{% static 'img/ViziApp.png' %}" alt="Logo ViziApp" class="auth-logo">
        <h1>ViziApp Login</h1>
        <p class="auth-subtitulo">Acesse sua conta para gerenciar seus serviços</p>

        {% if erro %}
            <div class="alerta-erro">{{ erro }}</div>
        {% endif %}

        <form method="POST" class="auth-form">
            {% csrf_token %}
            <div class="campo-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo-grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="auth-rodape">
            <p>Ainda não tem conta? <a href="{% url 'escolher_cadastro' %}">Cadastre-se</a></p>
            <a href="{% url 'inicial' %}" class="link-voltar">Voltar para o Início</a>
        </div>
    </div>
</div>
{% endblock %}
