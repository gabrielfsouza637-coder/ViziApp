<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViziApp - Cadastro</title>
    <style>
        body {
            background-color: #F4F8F8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h1 {
            color: #164E55; /* Verde-petróleo da logo */
            margin-bottom: 20px;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #FF6B57; /* Laranja/Coral da logo */
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e05a46;
        }
        .link {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        .link a {
            color: #164E55;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>ViziApp</h1>
        <form>
            <input type="text" placeholder="Seu nome" required>
            <input type="email" placeholder="Seu e-mail" required>
            <input type="password" placeholder="Crie uma senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <div class="link">
            Já tem uma conta? <a href="login.html">Entrar</a>
        </div>
    </div>

</body>
</html>
