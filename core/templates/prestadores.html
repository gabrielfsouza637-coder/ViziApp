<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prestadores Cadastrados - ViziApp</title>
</head>
<body>
    <h1>Prestadores Cadastrados</h1>

    <a href="{% url 'cadastrar_servico' %}">
        <button>+ Cadastrar Novo Prestador</button>
    </a>
    <a href="{% url 'inicial' %}">Voltar para o Início</a>

    <hr>

    <ul>
    {% for prestador in prestadores %}
        <li>
            <strong>{{ prestador.nome }}</strong><br>
            💬 WhatsApp: {{ prestador.whatsapp }} | ⏰ Horário: {{ prestador.horario }}<br>
            <a href="{% url 'editar_prestador' prestador.id %}">
                <button>✏️ Editar</button>
                <a href="{% url 'remover_prestador' prestador.id %}"><button> ❌ Remover </button></a>
                 
            </a>
        </li>
        <br>
    {% empty %}
        <li>Nenhum prestador cadastrado até o momento.</li>
    {% endfor %}
    </ul>
</body>
</html>
