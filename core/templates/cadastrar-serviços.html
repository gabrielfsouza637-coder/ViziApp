<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Prestador</title>
</head>
<body>
    <h1>Editar Dados do Prestador</h1>

    <form method="POST">
        {% csrf_token %}

        {% if form_prestador.errors %}
            <div style="color: red; font-weight: bold; margin-bottom: 15px;">
                {{ form_prestador.non_field_errors }}
                {% for field in form_prestador %}
                    {% for error in field.errors %}
                        <p>⚠️ {{ field.label }}: {{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}

        {{ form_prestador.as_p }}

        <button type="submit">Salvar Alterações</button>
    </form>

    <br>
    <a href="{% url 'listar_prestadores' %}">Voltar para a lista</a>
</body>
</html>
