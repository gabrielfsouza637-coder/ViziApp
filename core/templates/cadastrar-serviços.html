{% extends 'base.html' %}

{% block title %}Cadastro de Prestador - ViziApp{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Cadastro de Prestador</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form_prestador.as_p }} <!-- Confirme se na views.py o nome é form_prestador ou form -->
        <button type="submit" class="btn-submit">Concluir Cadastro</button>
    </form>

    <a href="{% url 'escolher_cadastro' %}" class="link-voltar">Voltar</a>
</div>
{% endblock %}
